name: Metadata and publication checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
        with:
          persist-credentials: false
      - name: Test orchestration and audit tracked sources
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/audit-public.py .
          python3 scripts/audit-docs.py .
      - name: Prepare fixed-identity workspace
        run: |
          install -d -m 0700 "$RUNNER_TEMP/openh432-work"
          # Both the runner and fixed container UID need access; no world write.
          install -d -m 0700 "$RUNNER_TEMP/openh432-work/home"
          setfacl -m "u:1000:rwx" "$RUNNER_TEMP/openh432-work" "$RUNNER_TEMP/openh432-work/home"
      - name: Build pinned container and fetch pinned layers
        run: python3 scripts/bsp.py checkout --work "$RUNNER_TEMP/openh432-work"
      - name: Test pinned layer contracts
        run: |
          python3 -m unittest discover -s "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-H432B/tests" -v
          python3 -m unittest discover -s "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-openh432/tests" -v
          python3 -m unittest discover -s "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-assets/tests" -v
      - name: Audit pinned layer sources
        run: python3 scripts/audit-public.py "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-H432B" "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-openh432" "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-assets"
      - name: Audit pinned layer documentation
        run: python3 scripts/audit-docs.py "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-H432B" "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-openh432" "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-assets"
      - name: Parse metadata offline
        run: python3 scripts/bsp.py parse --work "$RUNNER_TEMP/openh432-work"
      - name: Resolve all targets offline
        run: python3 scripts/bsp.py graph h432b-bootstate-check u-boot-h432b-ab u-boot-h432b-ab-chain u-boot-h432b-bootstate u-boot-h432b-bootstate-chain h432b-braille-check h432b-fm-check linux-h432b-wifi-test openh432-wifi-test u-boot-h432b u-boot-h432b-fastboot u-boot-h432b-nand u-boot-h432b-nand-profile u-boot-h432b-nand-timer u-boot-h432b-nand-subpage openh432-ram-dev openh432-fastboot-ram openh432-hardware-test u-boot-h432b-maintenance u-boot-h432b-maintenance-chain linux-h432b-power-test linux-h432b-resume-test linux-h432b-battery-test linux-h432b-runtime linux-h432b-input-test linux-h432b-gps-test linux-h432b-sd-rw-test linux-h432b-external-sd-test openh432-input-test openh432-gps-test openh432-sd-rw-test openh432-external-sd-test openh432-power-test openh432-resume-test openh432-battery-test openh432-early-b openh432-nand-b openh432-systembase-b --work "$RUNNER_TEMP/openh432-work"
