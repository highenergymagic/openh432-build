name: Metadata and publication checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test orchestration and audit tracked sources
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/audit-public.py .
          python3 scripts/audit-docs.py .
      - name: Prepare fixed-identity workspace
        run: |
          install -d -m 0700 "$RUNNER_TEMP/openh432-work"
          # Both the runner and fixed container UID need access; no world write.
          install -d -m 0700 "$RUNNER_TEMP/openh432-work/home"
          setfacl -m "u:1000:rwx" "$RUNNER_TEMP/openh432-work" "$RUNNER_TEMP/openh432-work/home"
      - name: Build pinned container and fetch pinned layers
        run: python3 scripts/bsp.py checkout --work "$RUNNER_TEMP/openh432-work"
      - name: Test pinned layer contracts
        run: |
          python3 -m unittest discover -s "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-H432B/tests" -v
          python3 -m unittest discover -s "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-openh432/tests" -v
          python3 -m unittest discover -s "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-assets/tests" -v
      - name: Audit pinned layer documentation
        run: python3 scripts/audit-docs.py "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-H432B" "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-openh432" "$RUNNER_TEMP/openh432-work/layers/meta-fractalmicro-assets"
      - name: Parse metadata offline
        run: python3 scripts/bsp.py parse --work "$RUNNER_TEMP/openh432-work"
      - name: Resolve all targets offline
        run: python3 scripts/bsp.py graph u-boot-h432b u-boot-h432b-ram u-boot-h432b-fastboot u-boot-h432b-nand u-boot-h432b-nand-auto u-boot-h432b-chain u-boot-h432b-nand-profile u-boot-h432b-nand-timer u-boot-h432b-nand-subpage linux-h432b openh432-ram-dev openh432-fastboot-ram openh432-hardware-test --work "$RUNNER_TEMP/openh432-work"
